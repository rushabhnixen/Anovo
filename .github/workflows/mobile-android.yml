name: Android Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/mobile-android.yml"

jobs:
  build-debug-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Test and type-check
        run: npm run test:ci -- --runInBand && npm run type-check

      - name: Sync Android app and brand assets
        run: npm run build:mobile && npx cap sync android && npm run mobile:assets

      - name: Build debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew test assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: anovo-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
