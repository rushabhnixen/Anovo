<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anovo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a202c;
      background: #fff;
    }

    .header {
      background: #0284c7;
      color: #fff;
      padding: 14px 16px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .header p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .section {
      padding: 12px 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: #0284c7;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .tool-btn {
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #334155;
      text-align: left;
      transition: all 0.15s;
    }

    .tool-btn:hover {
      background: #f0f9ff;
      border-color: #0284c7;
      color: #0284c7;
    }

    .tool-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tool-btn .icon {
      margin-right: 4px;
    }

    .output-area {
      display: none;
      margin-top: 8px;
    }

    .output-area.visible {
      display: block;
    }

    .output-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .output-actions button {
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-copy {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-copy:hover { background: #e2e8f0; }

    .btn-primary {
      background: #0284c7;
      color: #fff;
    }

    .btn-primary:hover { background: #0369a1; }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      padding: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #dc2626; font-size: 12px; padding: 8px; }

    .settings-link {
      padding: 8px 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-link a {
      font-size: 11px;
      color: #0284c7;
      text-decoration: none;
    }

    .settings-link a:hover { text-decoration: underline; }

    .settings-panel {
      padding: 12px 16px;
      border-top: 1px solid #e2e8f0;
      display: none;
    }

    .settings-panel.visible { display: block; }

    .settings-panel label {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      display: block;
      margin-bottom: 4px;
    }

    .settings-panel input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .settings-panel input:focus { border-color: #0284c7; }

    .settings-panel .save-btn {
      margin-top: 8px;
      padding: 5px 12px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Anovo</h1>
    <p>AI-Powered Writing Tool</p>
  </div>

  <div class="section">
    <div class="section-title">Input Text</div>
    <textarea id="input" placeholder="Paste or type text here..."></textarea>
  </div>

  <div class="section">
    <div class="section-title">Tools</div>
    <div class="tools">
      <button class="tool-btn" data-tool="humanize"><span class="icon">&#9998;</span> Humanize</button>
      <button class="tool-btn" data-tool="paraphrase"><span class="icon">&#8634;</span> Paraphrase</button>
      <button class="tool-btn" data-tool="grammar"><span class="icon">&#10003;</span> Grammar</button>
      <button class="tool-btn" data-tool="summarize"><span class="icon">&#9113;</span> Summarize</button>
      <button class="tool-btn" data-tool="translate"><span class="icon">&#127760;</span> Translate</button>
      <button class="tool-btn" data-tool="tone"><span class="icon">&#9835;</span> Tone</button>
    </div>

    <div id="output-area" class="output-area">
      <div id="output" class="output-box"></div>
      <div class="output-actions">
        <button class="btn-copy" id="copy-btn">Copy</button>
        <button class="btn-primary" id="open-btn">Open in Anovo</button>
      </div>
    </div>
  </div>

  <div class="settings-link">
    <span style="font-size:11px;color:#94a3b8">v1.0.0</span>
    <a href="#" id="settings-toggle">Settings</a>
  </div>

  <div id="settings-panel" class="settings-panel">
    <label for="api-url">API URL</label>
    <input type="text" id="api-url" placeholder="https://rushabh13-anovo-api.hf.space" />
    <button class="save-btn" id="save-settings">Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
