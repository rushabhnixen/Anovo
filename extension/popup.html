<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anovo</title>
  <style>
    :root { color-scheme: light dark; --brand:#059669; --brand2:#047857; --line:#e2e8f0; --muted:#64748b; --panel:#fff; --bg:#f8fafc; --text:#0f172a; }
    * { box-sizing:border-box; }
    body { width:380px; margin:0; background:radial-gradient(circle at 10% 0%,rgb(16 185 129/.1),transparent 220px),var(--bg); color:var(--text); font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid #34d399; outline-offset:2px; }
    .header { display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-bottom:1px solid var(--line); background:rgb(255 255 255/.9); }
    .brand { display:flex; align-items:center; gap:9px; }
    .logo { display:grid; place-items:center; width:32px; height:32px; border-radius:11px; background:var(--brand); color:#fff; font-weight:900; }
    .brand span:last-child { display:flex; flex-direction:column; }
    .brand strong { font-size:14px; line-height:1.1; }
    .brand small,.version { color:var(--muted); font-size:10px; }
    .version { padding:3px 7px; border-radius:999px; background:#f1f5f9; font-weight:800; }
    .wrap { padding:12px; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:15px; background:var(--panel); box-shadow:0 12px 32px rgb(15 23 42/.08); }
    .toolbar { display:flex; gap:8px; padding:10px; border-bottom:1px solid var(--line); }
    select,input { height:35px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); padding:6px 9px; }
    select { flex:1; font-weight:700; }
    textarea { display:block; width:100%; min-height:130px; resize:vertical; border:0; background:transparent; color:var(--text); padding:12px; line-height:1.65; outline:0; }
    .actions { display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-top:1px solid var(--line); }
    .actions span { color:var(--muted); font-size:10px; }
    button { min-height:32px; border:1px solid var(--line); border-radius:9px; background:#f8fafc; color:#475569; padding:6px 11px; font-size:11px; font-weight:750; cursor:pointer; }
    button:hover { border-color:#a7f3d0; background:#ecfdf5; color:var(--brand2); }
    .primary { border-color:var(--brand); background:var(--brand); color:#fff; }
    .primary:hover { border-color:var(--brand2); background:var(--brand2); color:#fff; }
    .result { display:none; border-top:1px solid var(--line); }
    .result.visible { display:block; }
    .result-head { display:flex; justify-content:space-between; align-items:center; padding:8px 11px; font-size:11px; font-weight:800; }
    .result-box { display:block; width:100%; min-height:145px; max-height:240px; resize:vertical; overflow:auto; border:0; border-top:1px solid #f1f5f9; background:#f8fafc; color:var(--text); padding:11px; white-space:pre-wrap; line-height:1.6; outline:0; }
    .result-box:focus { box-shadow:inset 0 0 0 2px rgb(16 185 129/.3); }
    .result-actions { display:flex; gap:6px; padding:8px 10px; }
    .loading { display:flex; align-items:center; gap:8px; color:var(--muted); }
    .spinner { width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; }
    .error { color:#dc2626; }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:10px; }
    .footer a { color:var(--brand2); font-size:11px; font-weight:700; text-decoration:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(prefers-color-scheme:dark){ :root{--panel:#0f172a;--bg:#020617;--line:#263449;--muted:#94a3b8;--text:#e2e8f0}.header{background:rgb(15 23 42/.9)}.version,button{background:#1e293b}.result-box{background:#0b1220;border-color:#172033} }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="logo">A</span><span><strong>Anovo</strong><small>Quick workspace</small></span></div>
    <span class="version">v1.3</span>
  </header>
  <div class="wrap">
    <section class="card">
      <div class="toolbar">
        <select id="tool" aria-label="Writing tool">
          <option value="paraphrase">↻ Paraphrase</option>
          <option value="humanize">✦ Humanize</option>
          <option value="grammar">✓ Grammar</option>
          <option value="summarize">≡ Summarize</option>
          <option value="translate">文 Translate</option>
          <option value="tone">◒ Tone</option>
        </select>
      </div>
      <textarea id="input" placeholder="Paste or type text here…"></textarea>
      <div class="actions">
        <span id="count">0 words</span>
        <button id="process" class="primary">Paraphrase</button>
      </div>
      <div id="output-area" class="result">
        <div class="result-head"><span id="result-label">Result</span></div>
        <textarea id="output" class="result-box" aria-label="Edit result"></textarea>
        <div class="result-actions">
          <button id="copy-btn">Copy</button>
          <button id="open-btn">Open full workspace</button>
        </div>
      </div>
    </section>
    <div class="footer">
      <a href="#" id="sidebar-toggle">Open sidebar workspace</a>
      <a href="https://anovo.vercel.app" target="_blank" rel="noreferrer">anovo.vercel.app ↗</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
