<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anovo Workspace</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <header class="sb-header">
    <a class="sb-brand" href="https://anovo.vercel.app" target="_blank" rel="noreferrer">
      <span class="sb-logo">A</span>
      <span>
        <strong>Anovo</strong>
        <small>Writing workspace</small>
      </span>
    </a>
    <span class="sb-version">v1.3</span>
  </header>

  <main class="sb-main">
    <section id="auth-section" class="sb-card sb-auth-card">
      <div id="auth-login">
        <div class="sb-card-heading">
          <div>
            <strong>Unlock PRO models</strong>
            <span>Sign in to use the latest GPT-OSS and Qwen writing models.</span>
          </div>
          <span class="sb-pro-badge">PRO</span>
        </div>
        <div class="sb-auth-fields">
          <input type="email" id="auth-email" placeholder="Email" class="sb-input" />
          <input type="password" id="auth-password" placeholder="Password" class="sb-input" />
          <button id="auth-submit" class="sb-btn sb-btn-primary">Sign in</button>
        </div>
        <div id="auth-error" class="sb-error" role="alert"></div>
      </div>
      <div id="auth-user" class="sb-auth-user" hidden>
        <div class="sb-user-info">
          <span class="sb-avatar">A</span>
          <span>
            <strong id="auth-username"></strong>
            <small id="auth-plan">Free plan</small>
          </span>
        </div>
        <button id="auth-logout" class="sb-btn sb-btn-quiet">Sign out</button>
      </div>
    </section>

    <section class="sb-workspace">
      <div class="sb-tool-row">
        <label for="tool-select">Tool</label>
        <select id="tool-select" class="sb-select">
          <option value="paraphrase">↻ Paraphrase</option>
          <option value="humanize">✦ Humanize</option>
          <option value="grammar">✓ Grammar</option>
          <option value="summarize">≡ Summarize</option>
          <option value="translate">文 Translate</option>
          <option value="tone">◒ Tone</option>
        </select>
      </div>

      <div id="mode-row" class="sb-mode-row" aria-label="Writing mode">
        <button class="sb-mode active" data-mode="standard">Standard</button>
        <button class="sb-mode" data-mode="fluency">Fluency</button>
        <button class="sb-mode" data-mode="humanize">Humanize</button>
        <button class="sb-mode" data-mode="formal">Formal</button>
        <button class="sb-mode" data-mode="simple">Simple</button>
        <button class="sb-mode" data-mode="creative">Creative</button>
        <button class="sb-mode" data-mode="academic">Academic</button>
        <button class="sb-mode" data-mode="expand">Expand</button>
        <button class="sb-mode" data-mode="shorten">Shorten</button>
      </div>

      <div id="paraphrase-controls" class="sb-control-row">
        <label for="intensity">Intensity <span id="intensity-value">3</span></label>
        <input id="intensity" type="range" min="1" max="5" value="3" />
      </div>

      <div id="summary-controls" class="sb-control-grid" hidden>
        <label>
          Format
          <select id="summary-mode" class="sb-select">
            <option value="paragraph">Paragraph</option>
            <option value="bullet">Bullet points</option>
          </select>
        </label>
        <label>
          Length
          <select id="summary-length" class="sb-select">
            <option value="80">Short</option>
            <option value="150" selected>Medium</option>
            <option value="300">Detailed</option>
          </select>
        </label>
      </div>

      <div id="translation-controls" class="sb-control-grid" hidden>
        <label>
          From
          <select id="source-language" class="sb-select">
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="hi">Hindi</option>
          </select>
        </label>
        <label>
          To
          <select id="target-language" class="sb-select">
            <option value="fr">French</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="hi">Hindi</option>
          </select>
        </label>
      </div>

      <div class="sb-editor">
        <div class="sb-editor-head">
          <span>Your text</span>
          <button id="sb-clear" class="sb-link-btn">Clear</button>
        </div>
        <textarea id="sb-input" class="sb-textarea" placeholder="Paste or type text here…"></textarea>
        <div class="sb-editor-foot">
          <span id="sb-count">0 words</span>
          <button id="sb-process" class="sb-btn sb-btn-primary">Paraphrase</button>
        </div>
      </div>

      <div id="model-section" class="sb-model-row">
        <label for="model-select">
          Model
          <span id="model-lock">Sign in for PRO</span>
        </label>
        <select id="model-select" class="sb-select">
          <option value="standard">Anovo Fast · Free</option>
          <option value="gpt-oss-120b">GPT-OSS 120B · PRO</option>
          <option value="gpt-oss-20b">GPT-OSS 20B · PRO</option>
          <option value="qwen-3.6-27b">Qwen 3.6 27B · PRO Preview</option>
        </select>
      </div>

      <div id="sb-output-area" class="sb-result" hidden>
        <div class="sb-editor-head">
          <span id="sb-result-label">Result</span>
          <div>
            <button id="sb-copy" class="sb-link-btn">Copy</button>
            <button id="sb-use-input" class="sb-link-btn">Use as input</button>
            <button id="sb-open" class="sb-link-btn">Open workspace</button>
          </div>
        </div>
        <textarea id="sb-output" class="sb-output-box" aria-label="Edit result"></textarea>
        <div id="sb-model-used" class="sb-model-used"></div>
      </div>
    </section>
  </main>

  <footer class="sb-footer sb-footer-links">
    <span>Results stay editable before you copy or replace them.</span>
    <a href="https://anovo.vercel.app/privacy" target="_blank" rel="noreferrer">Privacy</a>
  </footer>

  <script src="sidebar.js"></script>
</body>
</html>
